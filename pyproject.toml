[project]
name = "thesiscrew"
version = "0.1.0"
description = "thesisCrew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "apscheduler>=3.11.2",
    "crewai-tools[mcp]>=1.8.1",
    "crewai[tools]==1.8.1",
    "fastapi>=0.135.1",
    "fastapi-sso>=0.4.0",
    "langchain-openai>=0.3.23",
    "litellm>=1.75.3",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic[email]>=2.11.10",
    "python-dotenv>=1.1.1",
    "scikit-learn>=1.7.2",
]

[project.scripts]
thesiscrew = "thesiscrew.main:run"
run_crew = "thesiscrew.main:run"
train = "thesiscrew.main:train"
replay = "thesiscrew.main:replay"
test = "thesiscrew.main:test"
run_with_trigger = "thesiscrew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
